<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c2255c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WII Urnik">
<link rel="manifest" href="manifest-urnik.webmanifest">
<link rel="apple-touch-icon" href="icon-urnik-180.png">
<link rel="icon" type="image/png" href="icon-urnik-192.png">
<title>WII Urnik</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
:root{
  --bg:#eef2f7; --card:#fff; --primary:#c2255c; --primary-d:#8e1a46; --primary-l:#fde7ef; --text:#1f2937; --muted:#6b7280;
  --danger:#dc3545; --success:#198754; --warn:#f59e0b; --border:#dde3ec; --nav:64px;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font-family:inherit}
#root{height:100vh;height:100dvh;display:flex;flex-direction:column}

/* ---------- IKONE ---------- */
.ico{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em}
.ico.sm{width:1em;height:1em;vertical-align:-.15em}
.ico.lg{width:28px;height:28px}
.ico.xl{width:46px;height:46px;stroke-width:1.6}

/* ---------- PRIJAVA ---------- */
#login{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
.login-card{background:var(--card);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.08);padding:26px 22px;width:100%;max-width:460px}
.logo{width:64px;height:64px;border-radius:16px;margin:0 auto 10px;background:linear-gradient(180deg,#d6336c,#8a1842);color:#fff;display:flex;align-items:center;justify-content:center}
.login-card h1{color:var(--primary);font-size:28px;text-align:center}
.login-card .sub{color:var(--muted);text-align:center;font-size:14px;margin:4px 0 18px}
.ver{margin-top:18px;color:var(--muted);font-weight:700;font-size:13px;letter-spacing:2px;text-align:center;padding-bottom:20px}
.inp{width:100%;padding:13px 14px;border:2px solid var(--border);border-radius:10px;font-size:17px;background:#fff;outline:none;margin-bottom:10px;color:var(--text)}
.inp:focus{border-color:var(--primary)}
textarea.inp{resize:vertical;min-height:70px;font-size:15px}
.inp.sm{padding:9px 10px;font-size:15px;margin:0}
.lbl{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:6px 0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:12px;font-size:16px;font-weight:700;color:#fff;background:var(--primary)}
.btn.block{width:100%}
.btn.green{background:var(--success)} .btn.red{background:var(--danger)} .btn.ghost{background:#e5e9f0;color:var(--text)} .btn.warn{background:var(--warn);color:#222}
.btn.out{background:#fff;color:var(--primary);border:2px solid var(--primary)}
.btn.sm{padding:9px 12px;font-size:14px;border-radius:10px}
.quick-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;margin:18px 0 8px;text-align:center}
.quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.quick button{padding:11px 15px;border-radius:12px;background:#e5e9f0;color:var(--text);font-weight:600;font-size:15px}
.err{color:var(--danger);font-weight:700;text-align:center;font-size:14px;min-height:20px;margin-top:6px}

/* ---------- APLIKACIJA ---------- */
#app{flex:1;display:none;min-height:0}
#side{display:none}
#main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#topbar{background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
#topbar .ttl{font-size:18px;font-weight:700;flex:1;display:flex;align-items:center;gap:8px;min-width:0}
#topbar .ttl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .uname{font-size:13px;opacity:.95;text-align:right;line-height:1.2}
#topbar .tbtn{background:rgba(255,255,255,.2);color:#fff;width:40px;height:40px;border-radius:10px;display:none;align-items:center;justify-content:center}
#content{flex:1;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
.page{padding:16px;padding-bottom:calc(var(--nav) + 30px + env(safe-area-inset-bottom));max-width:920px;margin:0 auto}

/* spodnji meni (telefon) */
#bnav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:100;box-shadow:0 -4px 16px rgba(0,0,0,.05)}
#bnav button{flex:1;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);position:relative;min-width:0}
#bnav button .ico{width:24px;height:24px}
#bnav button.wide{flex:1.45}
#bnav button.on{color:var(--primary)}
#bnav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--primary)}
#bnav .nav-settings{display:none}
.nbadge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--danger);color:#fff;border-radius:10px;font-size:10px;padding:1px 6px;font-weight:800;line-height:15px}

/* stranski meni (računalnik) */
@media (min-width:900px){
  #app{flex-direction:row}
  #side{display:flex;flex-direction:column;width:240px;flex:none;background:#fff;border-right:1px solid var(--border);padding:16px 12px}
  #bnav{display:none}
  .page{padding-bottom:40px}
  .side-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:800;font-size:18px;color:var(--primary)}
  .side-brand .logo{width:40px;height:40px;border-radius:11px;margin:0}
  #snav{display:flex;flex-direction:column;gap:4px;flex:1}
  #snav button{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;font-weight:700;font-size:15px;color:var(--text);text-align:left;position:relative}
  #snav button:hover{background:#f3f5f9}
  #snav button.on{background:var(--primary-l);color:var(--primary)}
  #snav .nbadge{position:static;margin-left:auto}
  #snav .sep{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--muted);padding:14px 12px 4px}
  .side-user{border-top:1px solid var(--border);padding:12px 8px 0;font-size:13px;color:var(--muted)}
  .side-user b{display:block;color:var(--text);font-size:15px}
}
@media (max-width:899px){ #topbar .tbtn.adm{display:flex} #topbar .uname{display:none} }

/* ---------- SKUPNI ELEMENTI ---------- */
.box{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:14px}
.box h3{margin-bottom:10px;font-size:16px;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.row>*{flex:1}
.seg{display:flex;background:#e5e9f0;border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;padding:10px;border-radius:9px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px;font-size:15px}
.seg button.on{background:#fff;color:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.status{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;font-weight:700;font-size:12.5px;white-space:nowrap}
.status.ok{background:#d1f2de;color:#0b5a33}.status.no{background:#fde2e4;color:#8a1c27}.status.wr{background:#fff0c9;color:#7a5200}.status.bl{background:#dbeafe;color:#1e40af}.status.gr{background:#e5e9f0;color:#4b5563}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty .ico{color:#c3cad6;margin-bottom:8px}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
.notice{display:flex;gap:10px;align-items:flex-start;background:#fff7e0;color:#7a5200;border-radius:12px;padding:11px 13px;font-size:14px;font-weight:600;margin-bottom:14px}
.notice.info{background:#e8f1ff;color:#1e40af}
.notice.ok{background:#d1f2de;color:#0b5a33}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--border);width:100%;text-align:left}
.list-row:last-child{border-bottom:none}
button.list-row:hover{background:#fafbfd}
.list-row .grow{flex:1;min-width:0}
.list-row .t{font-weight:700}
.list-row .s{font-size:13px;color:var(--muted);margin-top:2px}
.fb{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:9px;font-weight:700;font-size:13px;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.iconbtn{width:38px;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:#eef1f6;color:var(--text);flex:none}
.iconbtn.red{background:#fde2e4;color:var(--danger)}
.iconbtn.on{background:var(--primary-l);color:var(--primary)}

/* datum */
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.datebar .d{flex:1;text-align:center}
.datebar .d b{display:block;font-size:18px}
.datebar .d span{font-size:13px;color:var(--primary);font-weight:700}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.week button{background:#fff;border-radius:12px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 1px 4px rgba(0,0,0,.05);border:2px solid transparent;position:relative}
.week button small{font-size:11px;font-weight:700;color:var(--muted)}
.week button b{font-size:18px}
.week button.today{border-color:#f3c3d4}
.week button.on{background:var(--primary);color:#fff}
.week button.on small{color:#fff;opacity:.85}
.week button i{width:6px;height:6px;border-radius:50%;background:transparent}
.week button i.y{background:var(--primary)}
.week button.on i.y{background:#fff}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:thin}
.strip button{flex:none;min-width:62px;background:#fff;border-radius:12px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 1px 4px rgba(0,0,0,.05);border:2px solid transparent}
.strip button small{font-size:11px;font-weight:700;color:var(--muted)}
.strip button b{font-size:17px}
.strip button i{display:flex;gap:3px;height:6px}
.strip button i em{width:6px;height:6px;border-radius:50%;display:block}
.strip button.on{border-color:var(--primary);background:var(--primary-l)}

/* izmena */
.shift{background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:14px;overflow:hidden}
.shift-h{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border)}
.shift-h .si{width:42px;height:42px;border-radius:12px;background:var(--primary-l);color:var(--primary);display:flex;align-items:center;justify-content:center;flex:none}
.shift-h .grow{flex:1;min-width:0}
.shift-h .t{font-weight:800;font-size:16px}
.shift-h .s{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:2px}
.shift-b{padding:6px 16px 12px}
.slot{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border)}
.slot:last-child{border-bottom:none}
.slot .who{flex:1;min-width:0;font-weight:700}
.slot .who small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.slot .who.free{color:var(--muted);font-weight:600;font-style:italic}
.slot.me{background:var(--primary-l);margin:0 -10px;padding:9px 10px;border-radius:10px;border-bottom-color:transparent}
.pick{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;border:2px dashed #cbd2dc;color:var(--muted);font-weight:700;text-align:left}
.pick.set{border-style:solid;border-color:var(--border);color:var(--text);background:#fafbfd}
.pick .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick small{display:block;font-weight:500;color:var(--muted);font-size:12px;white-space:normal}
.avl{width:10px;height:10px;border-radius:50%;flex:none}
.myshift{display:flex;gap:14px;align-items:center}
.myshift .time{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:15px}
.kv:last-child{border-bottom:none}

/* razpoložljivost */
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.opt{display:inline-flex;align-items:center;gap:8px;padding:11px 14px;border-radius:12px;font-weight:700;font-size:15px;background:#eef1f6;color:var(--text);border:2px solid transparent}
.opt .ck{width:20px;height:20px;border-radius:6px;border:2px solid #b8c0cc;display:flex;align-items:center;justify-content:center;background:#fff}
.opt .ck .ico{width:14px;height:14px;stroke-width:3;opacity:0}
.opt.on .ck{border-color:currentColor;background:currentColor}
.opt.on .ck .ico{opacity:1;color:#fff}
.opt.off.on{background:#fde2e4;color:var(--danger);border-color:var(--danger)}
.needs{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}

/* načrtovanje */
.prow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border)}
.prow:last-child{border-bottom:none}
.prow .grow{flex:1;min-width:0}
.step{display:flex;align-items:center;gap:4px;background:#eef1f6;border-radius:12px;padding:3px}
.step button{width:36px;height:36px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.step b{min-width:30px;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addf{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.addf button{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:9px;background:#f3f5f9;border:1px dashed #b8c0cc;font-weight:600;font-size:13px;color:var(--muted)}
.sticky{position:sticky;bottom:calc(var(--nav) + 10px + env(safe-area-inset-bottom));z-index:5;display:flex;gap:10px;background:rgba(238,242,247,.92);backdrop-filter:blur(6px);padding:10px;border-radius:14px;margin-top:6px}
.sticky>*{flex:1}
@media (min-width:900px){ .sticky{bottom:10px} }

/* tabela razpoložljivosti */
.mtx{width:100%;border-collapse:collapse;font-size:13.5px}
.mtx th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;text-align:center;padding:6px 4px;border-bottom:2px solid var(--border)}
.mtx th:first-child,.mtx td:first-child{text-align:left}
.mtx td{padding:8px 4px;border-bottom:1px solid var(--border);text-align:center;vertical-align:middle}
.mtx td .fi{display:inline-flex;width:24px;height:24px;border-radius:7px;align-items:center;justify-content:center;margin:1px}
.mtx td .fi .ico{width:14px;height:14px}
.mtxw{overflow-x:auto}

/* nastavitve */
.tgl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 4px;border-bottom:1px solid var(--border);font-weight:600;width:100%;text-align:left}
.tgl:last-child{border-bottom:none}
.tgl .sw{width:46px;height:26px;border-radius:26px;background:#cbd2dc;position:relative;transition:.2s;flex:none}
.tgl .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.tgl.on .sw{background:var(--success)} .tgl.on .sw::after{left:23px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 10px}
.swatches button{width:38px;height:38px;border-radius:10px;border:3px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.swatches button.on{border-color:#111}
.icgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin:4px 0 10px}
.icgrid button{height:46px;border-radius:10px;background:#eef1f6;display:flex;align-items:center;justify-content:center;border:2px solid transparent}
.icgrid button.on{border-color:var(--primary);background:var(--primary-l);color:var(--primary)}

/* ---------- MODAL ---------- */
#modal-root{position:fixed;inset:0;pointer-events:none;z-index:2000}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;overflow-y:auto;padding:14px;pointer-events:auto}
.modal{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:460px;margin:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.wide{max-width:600px}
.modal h3{font-size:19px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.grp{font-size:12px;font-weight:800;letter-spacing:.6px;color:var(--muted);text-transform:uppercase;margin:14px 0 4px;display:flex;align-items:center;gap:6px}

/* toast */
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:5000;pointer-events:none;display:flex;flex-direction:column;gap:8px;align-items:center;width:90%;max-width:420px}
.toast{background:#1f2937;color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:tin .2s;display:flex;gap:8px;align-items:center}
.toast.err{background:var(--danger)} .toast.ok{background:var(--success)} .toast.warn{background:var(--warn);color:#222}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
.spinner{width:44px;height:44px;border:5px solid #e5e9f0;border-top-color:var(--primary);border-radius:50%;margin:30px auto;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<svg id="sprite" width="0" height="0" style="position:absolute" aria-hidden="true"></svg>
<div id="root">

  <!-- PRIJAVA -->
  <div id="login">
    <div class="login-card">
      <div class="logo"><i data-ic="calendarDays" data-c="lg"></i></div>
      <h1>WII Urnik</h1>
      <div class="sub">Urnik dela in razpoložljivost</div>
      <label class="lbl">Uporabniško ime</label>
      <input id="lg-user" class="inp" autocomplete="username" autocapitalize="none" placeholder="Uporabniško ime">
      <label class="lbl">Geslo</label>
      <input id="lg-pass" type="password" class="inp" autocomplete="current-password" placeholder="Geslo">
      <button class="btn block" onclick="login()"><i data-ic="login"></i>Vpiši me</button>
      <div class="err" id="lg-err"></div>
      <div class="quick-title">Hitri dostop</div>
      <div class="quick" id="lg-quick"><span class="muted">Nalaganje…</span></div>
    </div>
    <div class="ver">VERZIJA 1.0</div>
  </div>

  <!-- APLIKACIJA -->
  <div id="app">
    <aside id="side">
      <div class="side-brand"><div class="logo"><i data-ic="calendarDays"></i></div>WII Urnik</div>
      <nav id="snav"></nav>
      <div class="side-user" id="side-user"></div>
    </aside>
    <div id="main">
      <div id="topbar">
        <div class="ttl" id="tb-title"></div>
        <div class="uname" id="tb-user"></div>
        <button class="tbtn adm" id="tb-set" onclick="go('settings')" title="Nastavitve"><i data-ic="settings"></i></button>
      </div>
      <div id="content"></div>
    </div>
    <nav id="bnav"></nav>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast"></div>

<script>
/* =====================================================================
   FIREBASE (ista baza kot blagajna in pošta – zaposleni se berejo od tam)
   ===================================================================== */
firebase.initializeApp({ databaseURL: "https://wii-sh-default-rtdb.europe-west1.firebasedatabase.app/" });
const db = firebase.database();
const P = 'wii_db_v3/pos';      // blagajna: zaposleni (employees)
const U = 'wii_db_v3/urnik';    // urnik: funkcije, vodje, dnevi (načrt, osnutek, objava), razpoložljivost

/* =====================================================================
   IKONE (SVG – brez emojijev)
   ===================================================================== */

/* =====================================================================
   POMOŽNE FUNKCIJE
   ===================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const clone = o => JSON.parse(JSON.stringify(o || {}));
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const byName = (a, b) => (a.name || '').localeCompare(b.name || '');
const dk = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = fromKey(k); d.setDate(d.getDate() + n); return dk(d); };
const today = () => dk(new Date());
const DOW = ['nedelja', 'ponedeljek', 'torek', 'sreda', 'četrtek', 'petek', 'sobota'];
const DOW3 = ['NED', 'PON', 'TOR', 'SRE', 'ČET', 'PET', 'SOB'];
const MONG = ['januarja', 'februarja', 'marca', 'aprila', 'maja', 'junija', 'julija', 'avgusta', 'septembra', 'oktobra', 'novembra', 'decembra'];
const fmtDay = k => { const d = fromKey(k); return `${cap(DOW[d.getDay()])}, ${d.getDate()}. ${MONG[d.getMonth()]} ${d.getFullYear()}`; };
const fmtShort = k => { const d = fromKey(k); return `${DOW3[d.getDay()].charAt(0) + DOW3[d.getDay()].slice(1).toLowerCase()} ${d.getDate()}. ${d.getMonth() + 1}.`; };
const relDay = k => k === today() ? 'Danes' : k === addDays(today(), 1) ? 'Jutri' : k === addDays(today(), -1) ? 'Včeraj' : '';
const fmtDT = iso => { if (!iso) return '-'; const d = new Date(iso); return `${d.getDate()}. ${d.getMonth() + 1}. ${d.getFullYear()} ob ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const mondayOf = k => { const d = fromKey(k), w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return dk(d); };
const shiftIcon = sh => { const n = (sh.name || '').toLowerCase(); return /noč|noc/.test(n) ? 'moon' : /popold|večer|vecer/.test(n) ? 'sunset' : /jutr|dopold/.test(n) ? 'sun' : 'layers'; };
const nIzmen = n => n + ' ' + (n === 1 ? 'izmena' : n === 2 ? 'izmeni' : n < 5 ? 'izmene' : 'izmen');
function stable(o) { // stabilen JSON (urejeni ključi) za primerjavo osnutka in objave
  if (o === null || typeof o !== 'object') return JSON.stringify(o ?? null);
  if (Array.isArray(o)) return '[' + o.map(stable).join(',') + ']';
  return '{' + Object.keys(o).filter(k => o[k] !== undefined && o[k] !== null && o[k] !== '').sort().map(k => JSON.stringify(k) + ':' + stable(o[k])).join(',') + '}';
}

function toast(msg, type = '') {
  const t = document.createElement('div'); t.className = 'toast ' + type;
  t.innerHTML = ic(type === 'err' ? 'alert' : type === 'ok' ? 'checkCircle' : 'info') + '<span></span>';
  t.querySelector('span').textContent = msg;
  $('toast').appendChild(t); setTimeout(() => t.remove(), 3600);
}
function openModal(html, wide) {
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal ${wide ? 'wide' : ''}">${html}</div>`;
  ov.addEventListener('click', e => { if (e.target === ov) ov.close(); });
  $('modal-root').appendChild(ov);
  ov.close = () => ov.remove();
  return ov;
}
function confirmBox(msg, yes, cb, danger = true) {
  const ov = openModal(`<h3>${ic(danger ? 'alert' : 'help')}Potrditev</h3><p style="margin:10px 0 4px;font-size:16px">${msg}</p>
    <div class="row"><button class="btn ghost" id="c-no">Ne</button><button class="btn ${danger ? 'red' : 'green'}" id="c-yes">${yes}</button></div>`);
  ov.querySelector('#c-no').onclick = () => ov.close();
  ov.querySelector('#c-yes').onclick = () => { ov.close(); cb(); };
}

const S = {
  ready: {}, emp: null, employees: {}, functions: {}, managers: {}, days: {}, avail: {},
  view: 'urnik', date: today(), mode: 'mine',
  availDate: null, availDraft: null,
  planDate: null, planDraft: null, planDirty: false,
  editDate: null, showMtx: false
};
const isAdmin = () => !!S.emp && S.emp.role === 'admin';
const isMgr = () => !!S.emp && (isAdmin() || !!S.managers[S.emp.id]);
const me = () => S.emp ? S.emp.id : null;
const empName = id => (S.employees[id] || {}).name || 'Neznan zaposleni';
const fn = id => S.functions[id] || { id, name: 'Neznana funkcija', color: '#6c757d', icon: 'briefcase' };
const funcOrder = (a, b) => ((fn(a).order ?? 99) - (fn(b).order ?? 99)) || fn(a).name.localeCompare(fn(b).name);
const funcsSorted = () => Object.values(S.functions).filter(Boolean).sort((a, b) => funcOrder(a.id, b.id));
const fBadge = (fid, extra = '') => { const f = fn(fid); return `<span class="fb" style="background:${f.color}1f;color:${f.color}">${ic(f.icon || 'briefcase', 'sm')}${esc(f.name)}${extra}</span>`; };
const shiftsOf = obj => Object.values((obj && obj.shifts) || {}).filter(Boolean).sort((a, b) => (a.order || 0) - (b.order || 0) || (a.name || '').localeCompare(b.name || ''));
const needTotal = sh => Object.values(sh.needs || {}).reduce((s, n) => s + (+n || 0), 0);
function slotsOf(sh) {
  const out = [];
  Object.keys(sh.needs || {}).sort(funcOrder).forEach(fid => { for (let i = 0; i < (+sh.needs[fid] || 0); i++) out.push({ key: fid + '_' + i, fid, i }); });
  return out;
}
const dayOf = k => S.days[k] || {};
const planOf = k => dayOf(k).plan || null;
const pubOf = k => dayOf(k).pub || null;
const availOf = (k, id) => ((S.avail[k] || {})[id]) || null;
function myAssignments(k, id) { // [{sh, slot, a}]
  const pub = pubOf(k); if (!pub) return [];
  const out = [];
  shiftsOf(pub).forEach(sh => {
    const as = (pub.assign || {})[sh.id] || {};
    Object.keys(as).forEach(sk => { const a = as[sk]; if (a && a.empId === id) out.push({ sh, sk, a }); });
  });
  return out;
}
// osnutek, ki bi se objavil (samo veljavna mesta)
function buildPub(k) {
  const day = dayOf(k), plan = day.plan; if (!plan) return null;
  const draft = day.draft || {}, assign = {};
  shiftsOf(plan).forEach(sh => {
    const src = (draft.assign || {})[sh.id] || {}, dst = {};
    slotsOf(sh).forEach(sl => { const a = src[sl.key]; if (a && a.empId && S.employees[a.empId]) dst[sl.key] = { empId: a.empId, fid: sl.fid, note: a.note || '' }; });
    if (Object.keys(dst).length) assign[sh.id] = dst;
  });
  return { shifts: plan.shifts || {}, assign, note: draft.note || '' };
}
function pubState(k) { // 'none' | 'pub' | 'changed'
  const pub = pubOf(k); if (!pub) return 'none';
  const cand = buildPub(k); if (!cand) return 'pub';
  return stable(cand) === stable({ shifts: pub.shifts, assign: pub.assign, note: pub.note }) ? 'pub' : 'changed';
}

/* ---------- Poslušanje baze ---------- */
function listen(key, ref) {
  ref.on('value', s => { S[key] = s.val() || {}; S.ready[key] = true; onData(key); },
    err => toast('Napaka povezave z bazo: ' + err.message, 'err'));
}
function startListeners() {
  const from = addDays(today(), -60);
  listen('employees', db.ref(P + '/employees'));
  listen('functions', db.ref(U + '/functions'));
  listen('managers', db.ref(U + '/managers'));
  listen('days', db.ref(U + '/days').orderByKey().startAt(from));
  listen('avail', db.ref(U + '/avail').orderByKey().startAt(addDays(today(), -14)));
}
function onData(key) {
  if (key === 'employees') {
    if (S.emp) {
      const e = S.employees[S.emp.id];
      if (!e) { toast('Tvoj račun je bil odstranjen.', 'err'); logout(); return; }
      S.emp = e;
    }
    renderLoginQuick();
  }
  if (key === 'functions') seedFunctions();
  if (!S.emp) return;
  if (key === 'managers' && !isMgr() && ['plan', 'edit', 'settings'].includes(S.view)) { S.planDirty = false; go('urnik', true); return; }
  renderChrome();
  // med tipkanjem ne prerišemo strani (da se vnos ne prekine)
  const a = document.activeElement;
  if (a && $('page') && $('page').contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) { S.pendingRefresh = true; return; }
  refreshView();
}
function seedFunctions() {
  if (!S.ready.functions || Object.keys(S.functions).length) return;
  db.ref(U + '/meta/seeded').transaction(v => v ? undefined : true, (e, ok) => {
    if (!ok) return;
    const up = {};
    [['Blagajna', '#0a58ca', 'register'], ['Pošta', '#fd7e14', 'mail'], ['Oddaja pošiljk', '#198754', 'scan'], ['Skladišče', '#8b5a2b', 'package'],
     ['Čiščenje', '#0dcaf0', 'sparkles'], ['Vodja izmene', '#6f42c1', 'crown']].forEach((f, i) => {
      const id = db.ref(U + '/functions').push().key;
      up[id] = { id, name: f[0], color: f[1], icon: f[2], order: i };
    });
    db.ref(U + '/functions').update(up);
  });
}

function renderLoginQuick() {
  const box = $('lg-quick'); if (!box) return;
  if (!S.ready.employees) { box.innerHTML = '<span class="muted">Nalaganje…</span>'; return; }
  box.innerHTML = Object.values(S.employees).filter(Boolean).sort(byName).map(e => `<button onclick="quickUser('${e.id}')">${esc(e.name)}</button>`).join('') || '<span class="muted">Ni uporabnikov</span>';
}
function quickUser(id) { const e = S.employees[id]; if (!e) return; $('lg-user').value = e.username; $('lg-pass').value = ''; $('lg-pass').focus(); }
function login() {
  const u = $('lg-user').value.trim().toLowerCase(), p = $('lg-pass').value;
  if (!S.ready.employees) { $('lg-err').textContent = 'Baza se še nalaga…'; return; }
  const e = Object.values(S.employees).find(x => x && (x.username || '').toLowerCase() === u && x.password === p);
  if (!e) { $('lg-err').textContent = 'Napačno uporabniško ime ali geslo!'; $('lg-pass').value = ''; return; }
  $('lg-err').textContent = '';
  S.emp = e; try { localStorage.setItem('wii_urnik_emp', e.id); } catch (x) {}
  $('lg-user').value = ''; $('lg-pass').value = '';
  showApp();
}
function showApp() {
  $('login').style.display = 'none'; $('app').style.display = 'flex';
  S.date = today(); S.mode = 'mine'; go('urnik');
}
function logout() {
  const doIt = () => {
    S.emp = null; S.planDraft = null; S.planDirty = false; S.availDraft = null;
    try { localStorage.removeItem('wii_urnik_emp'); } catch (x) {}
    $('app').style.display = 'none'; $('login').style.display = 'flex';
    $('modal-root').innerHTML = ''; renderLoginQuick();
  };
  if (S.planDirty) return confirmBox('Načrt dneva ni shranjen. Se res želiš odjaviti?', 'Odjava', doIt);
  doIt();
}

const TITLES = { urnik: ['calendarDays', 'Urnik'], avail: ['clipboard', 'Razpoložljivost'], availDay: ['clipboard', 'Razpoložljivost'], plan: ['calendarPlus', 'Načrtuj dan'], edit: ['calendarEdit', 'Uredi urnik'], settings: ['settings', 'Nastavitve'] };
function badgeAvail() { // načrtovani prihodnji dnevi brez moje razpoložljivosti
  return Object.keys(S.days).filter(k => k >= today() && planOf(k) && shiftsOf(planOf(k)).length && !pubOf(k) && !availOf(k, me())).length;
}
function badgeEdit() {
  return Object.keys(S.days).filter(k => k >= today() && planOf(k) && pubState(k) !== 'pub').length;

function copyPlanDlg() {

function savePlan() {
  const k = S.planDate, shifts = shiftsOf(S.planDraft);
  if (!shifts.length) return toast('Dodaj vsaj eno izmeno.', 'err');
  for (const sh of shifts) {
    if (!(sh.name || '').trim()) return toast('Vsaka izmena mora imeti ime.', 'err');
    if (!needTotal(sh)) return toast(`Izmena »${sh.name}« nima nobene funkcije.`, 'err');
  }
  const out = {};
  shifts.forEach((sh, i) => { out[sh.id] = { id: sh.id, name: (sh.name || 'Izmena').trim() || 'Izmena', needs: sh.needs, order: i }; });
  db.ref(`${U}/days/${k}/plan`).set({ shifts: out, by: S.emp.name, at: new Date().toISOString() })
    .then(() => { S.planDirty = false; toast('Načrt dneva shranjen. Zaposleni lahko oddajo razpoložljivost.', 'ok'); loadPlan(k); viewPlan(); renderChrome(); })
    .catch(e => toast('Napaka: ' + e.message, 'err'));
}
function delPlan() {
  const k = S.planDate;
  confirmBox(`Izbrišem celoten načrt za <b>${fmtDay(k)}</b>? Izbrišejo se tudi razporeditev, objavljen urnik in oddane razpoložljivosti.`, 'Izbriši', () => {

}

function manageFunctions() {

    ov.querySelector('.modal').innerHTML = `<h3>${ic('briefcase')}Funkcije</h3><div class="muted">Funkcije, ki jih lahko potrebuješ na izmeni.</div>
      <div style="margin-top:10px">${funcsSorted().map(f => `<div class="list-row"><div class="grow">${fBadge(f.id)}</div><button class="iconbtn" data-e="${f.id}" title="Uredi">${ic('edit')}</button><button class="iconbtn red" data-d="${f.id}" title="Izbriši">${ic('trash')}</button></div>`).join('') || '<div class="muted">Ni funkcij.</div>'}</div>
      <div class="row"><button class="btn ghost" id="mf-x">Zapri</button><button class="btn green" id="mf-n">${ic('plus')}Nova funkcija</button></div>`;
    ov.querySelector('#mf-x').onclick = () => ov.close();

function editFunction(id, after) {
  const f = id ? S.functions[id] : null;
  let col = f ? f.color : PALETTE[0], icon = f ? f.icon : 'briefcase';
  const ov = openModal(`<h3>${ic(f ? 'edit' : 'plus')}${f ? 'Uredi funkcijo' : 'Nova funkcija'}</h3>
    <label class="lbl">Naziv</label><input id="fe-n" class="inp" maxlength="30" value="${esc(f ? f.name : '')}" placeholder="npr. Blagajna">
    <label class="lbl">Barva</label><div class="swatches" id="fe-c"></div>
    <label class="lbl">Ikona</label><div class="icgrid" id="fe-i"></div>
    <div class="row"><button class="btn ghost" id="fe-x">Prekliči</button><button class="btn green" id="fe-ok">${ic('save')}Shrani</button></div>`);
  const draw = () => {
    ov.querySelector('#fe-c').innerHTML = PALETTE.map(c => `<button data-c="${c}" class="${c === col ? 'on' : ''}" style="background:${c}"></button>`).join('');
    ov.querySelector('#fe-i').innerHTML = FUNC_ICONS.map(n => `<button data-i="${n}" class="${n === icon ? 'on' : ''}" style="${n === icon ? `color:${col};border-color:${col};background:${col}1a` : ''}">${ic(n)}</button>`).join('');
  };
  ov.querySelector('#fe-c').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (b) { col = b.dataset.c; draw(); } });
  ov.querySelector('#fe-i').addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) { icon = b.dataset.i; draw(); } });
  ov.querySelector('#fe-x').onclick = () => ov.close();
  ov.querySelector('#fe-ok').onclick = () => {
    const name = ov.querySelector('#fe-n').value.trim();
    if (!name) return toast('Vpiši naziv funkcije.', 'err');
    if (funcsSorted().some(x => x.id !== id && x.name.toLowerCase() === name.toLowerCase())) return toast('Funkcija s tem nazivom že obstaja.', 'err');
    const fid = id || db.ref(U + '/functions').push().key;
    const order = f ? (f.order ?? 99) : funcsSorted().length;
    db.ref(U + '/functions/' + fid).set({ id: fid, name, color: col, icon, order }).then(() => { ov.close(); toast('Shranjeno', 'ok'); if (after) setTimeout(after, 50); });
  };
  draw();
  setTimeout(() => ov.querySelector('#fe-n').focus(), 50);
}

function defaultEditDate() {

  return fut.find(k => pubState(k) !== 'pub') || fut[0] || today();
}
function editPick(k) { if (k) { S.editDate = k; viewEdit(); } }
function availFor(k, empId, sid) { const a = availOf(k, empId); return a ? ((a.shifts || {})[sid] || null) : null; }
function viewEdit() {

    <h2 style="font-size:19px;margin:4px 2px 10px">${fmtDay(k)} ${relDay(k) ? `<span class="status bl">${relDay(k)}</span>` : ''}</h2>`;
  if (!plan) {
    h += `<div class="box empty">${ic('calendarX', 'xl')}<b>Za ta dan še ni načrta</b>Najprej določi izmene in funkcije.<div style="margin-top:12px"><button class="btn" onclick="S.planDraft=null;S.planDirty=false;S.planDate='${k}';go('plan')">${ic('calendarPlus')}Načrtuj dan</button></div></div>`;
    $('page').innerHTML = h; return;

    ${S.showMtx ? `<div class="mtxw" style="margin-top:12px"><table class="mtx"><thead><tr><th>Zaposleni</th>${shifts.map(sh => `<th>${esc(sh.name)}</th>`).join('')}</tr></thead><tbody>
      ${emps.map(e => { const a = availOf(k, e.id); return `<tr><td><b>${esc(e.name)}</b>${a && a.note ? `<div class="muted" style="font-size:12px">${ic('note', 'sm')} ${esc(a.note)}</div>` : ''}</td>${shifts.map(sh => {
        const v = availFor(k, e.id, sh.id);
        if (!v) return `<td title="Ni oddal"><span style="color:#b8c0cc">${ic('help', 'sm')}</span></td>`;
        if (v.off) return `<td title="Ne more"><span style="color:var(--danger)">${ic('ban', 'sm')}</span></td>`;

      }).join('')}</tr>`; }).join('')}</tbody></table>

      }).join('')}</div></div>`;
  }).join('');

  h += `<div class="box"><label class="lbl">${ic('note', 'sm')} Opomba za celoten dan (vidijo jo vsi)</label><textarea id="ed-note" class="inp" maxlength="400" placeholder="npr. ob 10:00 dostava blaga"></textarea></div>

  $('page').innerHTML = h;
  const n = $('ed-note'); n.value = draft.note || '';
  n.addEventListener('change', () => db.ref(`${U}/days/${k}/draft/note`).set(n.value.trim() || null));
}
function pickEmp(sid, sk) {
  const k = S.editDate, plan = planOf(k), sh = plan && plan.shifts[sid]; if (!sh) return;
  const fid = sk.slice(0, sk.lastIndexOf('_')), draft = dayOf(k).draft || {}, cur = ((draft.assign || {})[sid] || {})[sk];
  const shifts = shiftsOf(plan);
  // kje je kdo že razporejen
  const busy = {}, also = {};
  shifts.forEach(x => Object.entries((draft.assign || {})[x.id] || {}).forEach(([key, a]) => {
    if (!a || !a.empId || (x.id === sid && key === sk)) return;
    if (x.id === sid) (busy[a.empId] = busy[a.empId] || []).push('že na tej izmeni (' + fn(a.fid).name + ')');
    else (also[a.empId] = also[a.empId] || []).push(x.name);
  }));
  const groups = { yes: [], other: [], none: [], off: [] };
  Object.values(S.employees).filter(Boolean).sort(byName).forEach(e => {
    const v = availFor(k, e.id, sid);
    if (!v) groups.none.push(e); else if (v.off) groups.off.push(e);
    else if ((v.funcs || {})[fid]) groups.yes.push(e); else groups.other.push(e);
  });
  const row = (e, col, sub) => {
    const b = busy[e.id], sel = cur && cur.empId === e.id;
    return `<button class="list-row" data-e="${e.id}" ${b ? 'disabled' : ''} style="${sel ? 'background:var(--primary-l);border-radius:10px' : ''}"><span class="avl" style="background:${col}"></span><span class="grow"><span class="t" style="display:block">${esc(e.name)}</span>${sub ? `<span class="s">${sub}</span>` : ''}${!b && also[e.id] ? `<span class="s" style="color:#b7791f">ta dan tudi: ${esc(also[e.id].join(', '))}</span>` : ''}${b ? `<span class="s" style="color:var(--danger)">${esc(b.join(', '))}</span>` : ''}</span>${sel ? ic('check') : ''}</button>`;
  };
  const other = e => { const v = availFor(k, e.id, sh.id); return 'lahko: ' + Object.keys(v.funcs || {}).sort(funcOrder).map(f => esc(fn(f).name)).join(', '); };
  const note = e => { const a = availOf(k, e.id); return a && a.note ? ic('note', 'sm') + ' ' + esc(a.note) : ''; };
  const ov = openModal(`<h3>${ic(fn(fid).icon || 'briefcase')}${esc(fn(fid).name)}</h3><div class="muted">${esc(sh.name)}</div>
    <div style="max-height:60vh;overflow-y:auto;margin-top:6px">
    ${groups.yes.length ? `<div class="grp" style="color:var(--success)">${ic('checkCircle', 'sm')}Na voljo za to funkcijo</div>${groups.yes.map(e => row(e, 'var(--success)', note(e))).join('')}` : ''}
    ${groups.other.length ? `<div class="grp" style="color:#b7791f">${ic('info', 'sm')}Na voljo, a za drugo funkcijo</div>${groups.other.map(e => row(e, 'var(--warn)', other(e))).join('')}` : ''}
    ${groups.none.length ? `<div class="grp">${ic('help', 'sm')}Razpoložljivosti ni oddal(a)</div>${groups.none.map(e => row(e, '#b8c0cc', '')).join('')}` : ''}
    ${groups.off.length ? `<div class="grp" style="color:var(--danger)">${ic('ban', 'sm')}Ne more delati</div>${groups.off.map(e => row(e, 'var(--danger)', note(e))).join('')}` : ''}
    </div>
    <div class="row">${cur ? `<button class="btn red" id="pe-rm">${ic('x')}Odstrani</button>` : ''}<button class="btn ghost" id="pe-x">Zapri</button></div>`);
  const ref = db.ref(`${U}/days/${k}/draft/assign/${sid}/${sk}`);
  const set = e => ref.set({ empId: e.id, fid, note: cur ? cur.note || '' : '' }).then(() => ov.close()).catch(er => toast('Napaka: ' + er.message, 'err'));
  ov.querySelectorAll('[data-e]').forEach(b => b.onclick = () => {
    const e = S.employees[b.dataset.e]; if (!e) return;
    const v = availFor(k, e.id, sid);
    if (v && v.off) return confirmBox(`<b>${esc(e.name)}</b> je označil(a), da te izmene ne more delati. Vseeno razporedim?`, 'Razporedi', () => set(e), false);
    set(e);
  });
  ov.querySelector('#pe-x').onclick = () => ov.close();
  const rm = ov.querySelector('#pe-rm'); if (rm) rm.onclick = () => ref.remove().then(() => ov.close());
}
function slotNote(sid, sk) {
  const k = S.editDate, cur = ((((dayOf(k).draft || {}).assign || {})[sid]) || {})[sk]; if (!cur) return;
  const ov = openModal(`<h3>${ic('note')}Opomba</h3><div class="muted">${esc(empName(cur.empId))} · ${esc(fn(cur.fid).name)}</div>
    <textarea id="sn-t" class="inp" style="margin-top:10px" maxlength="200" placeholder="npr. odpre blagajno 2"></textarea>
    <div class="row"><button class="btn ghost" id="sn-x">Prekliči</button><button class="btn green" id="sn-ok">${ic('save')}Shrani</button></div>`);
  const t = ov.querySelector('#sn-t'); t.value = cur.note || ''; setTimeout(() => t.focus(), 50);
  ov.querySelector('#sn-x').onclick = () => ov.close();
  ov.querySelector('#sn-ok').onclick = () => db.ref(`${U}/days/${k}/draft/assign/${sid}/${sk}/note`).set(t.value.trim()).then(() => ov.close());
}
function publish() {
  const k = S.editDate, cand = buildPub(k); if (!cand) return;
  const n = $('ed-note'); if (n) cand.note = n.value.trim();
  const total = shiftsOf(planOf(k)).reduce((s, sh) => s + slotsOf(sh).length, 0);
  const filled = Object.values(cand.assign).reduce((s, x) => s + Object.keys(x).length, 0);
  const doIt = () => {
    const up = {};
    up[`days/${k}/draft/note`] = cand.note || null;
    up[`days/${k}/pub`] = Object.assign(cand, { at: new Date().toISOString(), by: S.emp.name });
    db.ref(U).update(up).then(() => toast('Urnik je objavljen zaposlenim.', 'ok')).catch(e => toast('Napaka: ' + e.message, 'err'));
  };
  if (filled < total) return confirmBox(`Zasedenih je ${filled} od ${total} mest. Vseeno objavim urnik?`, 'Objavi', doIt, false);
  doIt();
}
function unpublish() {
  confirmBox(`Umaknem objavljen urnik za <b>${fmtDay(S.editDate)}</b>? Zaposleni ga ne bodo več videli (osnutek ostane).`, 'Umakni', () => db.ref(`${U}/days/${S.editDate}/pub`).remove().then(() => toast('Objava umaknjena.', 'warn')));
}

function toggleMgr(id) { db.ref(U + '/managers/' + id).set(S.managers[id] ? null : true); }

/* =====================================================================
   ZAGON
   ===================================================================== */
initIcons();
$('lg-user').addEventListener('keydown', e => { if (e.key === 'Enter') $('lg-pass').focus(); });
$('lg-pass').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
startListeners();

// samodejna ponovna prijava po osvežitvi
(function autoLogin() {
  let id = null; try { id = localStorage.getItem('wii_urnik_emp'); } catch (e) {}
  if (!id) return;
  const t = setInterval(() => {
    if (!S.ready.employees) return;
    clearInterval(t);
    if (S.employees[id]) { S.emp = S.employees[id]; showApp(); }
  }, 150);
})();
document.addEventListener('focusout', () => setTimeout(() => { if (S.pendingRefresh && !(document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName))) { S.pendingRefresh = false; keepScroll(refreshView); } }, 200));
window.addEventListener('beforeunload', e => { if (S.planDirty) { e.preventDefault(); e.returnValue = ''; } });
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
