<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c8599">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WIIfon">
<link rel="manifest" href="manifest-fon.webmanifest">
<link rel="apple-touch-icon" href="icon-fon-180.png">
<link rel="icon" type="image/png" href="icon-fon-192.png">
<title>WIIfon</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
:root{--p:#0c8599;--pd:#0b5563;--pl:#e3f6f8;--bg:#f4f6f9;--card:#fff;--text:#111827;--muted:#6b7280;--green:#22c55e;--red:#ef4444;--border:#e5e7eb;--tab:64px}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text)}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font-family:inherit}
.ico{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em}
.ico.sm{width:1em;height:1em;vertical-align:-.15em}
.ico.fill{fill:currentColor;stroke:none}

#root{height:100vh;height:100dvh;display:flex;justify-content:center}
.phone{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;background:var(--card);position:relative;overflow:hidden}
@media (min-width:560px){ body{background:linear-gradient(160deg,#dff3f6,#eef2f7)} #root{padding:24px 0} .phone{border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.15);max-height:900px} }

/* zgoraj */
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;padding-top:calc(14px + env(safe-area-inset-top))}
.top .brand{font-weight:800;font-size:20px;color:var(--p);flex:1;display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:20px;background:var(--pl);color:var(--pd);font-weight:700;font-size:13px}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.chip.off .dot{background:#9ca3af}
.ibtn{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:#f1f3f6;color:var(--text);flex:none}
.view{flex:1;overflow-y:auto;min-height:0}
.banner{margin:0 16px 8px;padding:10px 12px;border-radius:12px;background:#fff4d6;color:#7a5200;font-weight:600;font-size:13.5px;display:flex;gap:8px;align-items:center}

/* spodnji zavihki */
.tabs{display:flex;border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);background:#fff}
.tabs button{flex:1;height:var(--tab);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted);position:relative}
.tabs button .ico{width:24px;height:24px}
.tabs button.on{color:var(--p)}
.badge{position:absolute;top:7px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:10px;font-size:10px;padding:1px 6px;font-weight:800;line-height:15px}

/* tipkovnica */
.dialwrap{height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 24px 18px}
.disp{text-align:center;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:10px}
.disp .num{font-size:40px;font-weight:500;letter-spacing:2px;font-variant-numeric:tabular-nums;word-break:break-all;line-height:1.15}
.disp .name{color:var(--p);font-weight:700;font-size:16px;min-height:22px;margin-top:4px}
.disp .name.unk{color:var(--muted);font-weight:500}
.sugg{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:34px;margin-bottom:6px}
.sugg button{padding:6px 12px;border-radius:16px;background:#f1f3f6;font-size:13px;font-weight:600}
.sugg button b{color:var(--p)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 22px;max-width:320px;margin:0 auto;width:100%}
.key{aspect-ratio:1/1;max-height:80px;border-radius:50%;background:#f1f3f6;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;transition:background .1s;justify-self:center;width:100%;max-width:80px}
.key:active,.key.pr{background:#d9e0e8}
.key b{font-size:32px;font-weight:400;line-height:1}
.key small{font-size:10.5px;font-weight:700;letter-spacing:2px;color:var(--muted);height:13px;margin-top:2px}
.callrow{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;max-width:320px;margin:16px auto 0;width:100%;align-items:center}
.cbtn{width:72px;height:72px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;justify-self:center;box-shadow:0 6px 16px rgba(34,197,94,.35)}
.cbtn .ico{width:32px;height:32px}
.cbtn.red{background:var(--red);box-shadow:0 6px 16px rgba(239,68,68,.35)}
.bsp{justify-self:center;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.bsp .ico{width:28px;height:28px}

/* seznami */
.sec{padding:6px 16px 20px}
.h1{font-size:28px;font-weight:800;margin:4px 0 12px;display:flex;align-items:center;gap:10px}
.h1 .sp{flex:1}
.search{display:flex;align-items:center;gap:8px;background:#f1f3f6;border-radius:12px;padding:0 12px;margin-bottom:10px;color:var(--muted)}
.search input{flex:1;border:none;background:none;outline:none;padding:12px 0;font-size:16px;color:var(--text)}
.row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--border);width:100%;text-align:left}
.row:last-child{border-bottom:none}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t.miss{color:var(--red)}
.row .s{font-size:13px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px}
.row .r{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;flex:none;position:relative}
.av.lg{width:96px;height:96px;font-size:36px}
.av .on{position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;background:var(--green);border:2px solid #fff}
.av.lg .on{width:22px;height:22px;border-width:3px}
.letter{font-size:12px;font-weight:800;color:var(--p);padding:12px 4px 2px;letter-spacing:1px}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty .ico{width:46px;height:46px;color:#cbd2dc;margin-bottom:8px;stroke-width:1.6}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
.callmini{width:40px;height:40px;border-radius:50%;background:var(--pl);color:var(--p);display:flex;align-items:center;justify-content:center;flex:none}

/* gumbi, obrazci */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:14px;font-size:16px;font-weight:700;color:#fff;background:var(--p)}
.btn.block{width:100%}
.btn.ghost{background:#eef1f5;color:var(--text)} .btn.red{background:var(--red)} .btn.green{background:var(--green)}
.btn.sm{padding:9px 13px;font-size:14px;border-radius:11px}
.inp{width:100%;padding:13px 14px;border:2px solid var(--border);border-radius:12px;font-size:17px;outline:none;background:#fff;color:var(--text);margin-bottom:10px}
.inp:focus{border-color:var(--p)}
.lbl{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:6px 0 4px}
.rowbtns{display:flex;gap:10px;margin-top:12px}
.rowbtns>*{flex:1}
.err{color:var(--red);font-weight:700;font-size:14px;min-height:20px;text-align:center;margin-top:4px}
.box{background:#f8fafc;border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:12px 0;font-weight:600;border-bottom:1px solid var(--border)}
.tgl:last-child{border-bottom:none}
.tgl .sw{width:46px;height:26px;border-radius:26px;background:#cbd2dc;position:relative;transition:.2s;flex:none}
.tgl .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.tgl.on .sw{background:var(--green)} .tgl.on .sw::after{left:23px}

/* aktivacija */
.act{flex:1;overflow-y:auto;padding:24px 20px;padding-top:calc(30px + env(safe-area-inset-top))}
.logo{width:76px;height:76px;border-radius:20px;margin:0 auto 12px;background:linear-gradient(180deg,#15aabf,#0b5563);color:#fff;display:flex;align-items:center;justify-content:center}
.logo .ico{width:38px;height:38px}
.act h1{text-align:center;font-size:30px;color:var(--p)}
.act .sub{text-align:center;color:var(--muted);margin:4px 0 22px}

/* klic */
.call{position:absolute;inset:0;z-index:50;background:linear-gradient(170deg,#0b5563,#082f3a 70%);color:#fff;display:flex;flex-direction:column;align-items:center;padding:calc(56px + env(safe-area-inset-top)) 24px calc(40px + env(safe-area-inset-bottom));transition:opacity .2s}
.call.hidden{display:none}
.call .who{font-size:32px;font-weight:700;text-align:center;margin-top:22px;line-height:1.15;word-break:break-word}
.call .no{opacity:.75;font-size:17px;margin-top:6px;letter-spacing:1px}
.call .st{margin-top:14px;font-size:17px;opacity:.9;font-variant-numeric:tabular-nums;min-height:24px;text-align:center}
.call .av{background:rgba(255,255,255,.14)!important}
.ring{position:relative}
.ring::before,.ring::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid rgba(255,255,255,.35);animation:rp 2s infinite}
.ring::after{animation-delay:1s}
@keyframes rp{from{transform:scale(.9);opacity:1}to{transform:scale(1.45);opacity:0}}
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 40px;margin-top:auto;margin-bottom:30px}
.cact{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:600;opacity:.95}
.cact span.c{width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center}
.cact span.c .ico{width:28px;height:28px}
.cact.on span.c{background:#fff;color:#0b5563}
.cact:disabled{opacity:.35}
.cbig{display:flex;gap:70px;justify-content:center;margin-top:auto}
.cbig .cbtn{width:78px;height:78px}
.cbig .lab{display:flex;flex-direction:column;align-items:center;gap:9px;font-weight:600;font-size:14px}
.swipeup{animation:bob 1.2s infinite}
@keyframes bob{50%{transform:translateY(-6px)}}

/* modal, toast */
#modal-root{position:fixed;inset:0;pointer-events:none;z-index:2000}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-end;justify-content:center;pointer-events:auto}
@media (min-width:560px){ .overlay{align-items:center} }
.modal{background:#fff;border-radius:22px 22px 0 0;padding:20px;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom));animation:up .2s}
@media (min-width:560px){ .modal{border-radius:22px} }
@keyframes up{from{transform:translateY(30px);opacity:0}}
.modal h3{font-size:20px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted);font-size:14px}
#toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);z-index:5000;display:flex;flex-direction:column;gap:8px;align-items:center;width:90%;max-width:420px;pointer-events:none}
.toast{background:#1f2937;color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;gap:8px;align-items:center;animation:up .2s}
.toast.err{background:var(--red)} .toast.ok{background:#16a34a}
.quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.quick button{padding:10px 14px;border-radius:12px;background:#eef1f5;font-weight:600;font-size:15px}
.quick button small{color:var(--p);font-weight:800;margin-left:6px}
.seg{display:flex;background:#eef1f5;border-radius:12px;padding:4px;gap:4px;margin:10px 0 6px}
.seg button{flex:1;padding:10px;border-radius:9px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:#fff;color:var(--p);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.tag{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:800;letter-spacing:.3px}
.tag.emp{background:#e3f6f8;color:#0b5563}.tag.ext{background:#fff0d6;color:#8a4b00}
.grp{font-size:12px;font-weight:800;letter-spacing:.6px;color:var(--muted);text-transform:uppercase;margin:14px 0 2px}
.spinner{width:44px;height:44px;border:5px solid #e5e9f0;border-top-color:var(--p);border-radius:50%;margin:40px auto;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<svg id="sprite" width="0" height="0" style="position:absolute" aria-hidden="true"></svg>
<div id="root"><div class="phone" id="phone"></div></div>
<div id="modal-root"></div>
<div id="toast"></div>
<audio id="remote" autoplay playsinline></audio>

  checkCircle: '<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  alert: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/>',

const ICE = { iceServers: [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }] };

async function dial(num) {

  if (num === S.me) return toast('To je tvoja številka.', 'err');
  ac();
  const id = db.ref(F + '/calls').push().key, at = nowIso();
  newCall({ id, role: 'out', other: num, status: 'calling', createdAt: at });
  if (!S.lines[num]) { C.status = 'invalid'; showCall(); sitTone(); return later(() => finish(null, null), 3200); }
  if (!isOnline(num)) { C.status = 'unreachable'; showCall(); sitTone(); writeHist('out', num, 'unreachable', at, 0); return later(() => finish(null, null), 3500); }
  if (isBusy(num)) { C.status = 'busy'; showCall(); busyTone(); writeHist('out', num, 'busy', at, 0); return later(() => finish(null, null), 4500); }
  try { C.stream = await getMic(); } catch (e) { toast('Mikrofon ni dovoljen: ' + (e.message || e.name), 'err'); return finish(null, null); }

  await C.pc.setLocalDescription(offer);

    const v = s.val(); if (!C || C.id !== id) return;

const handled = {};

    const r = v[id]; if (!r || Date.now() - (r.at || 0) > RING_SEC * 1000) return;
    callRef(id).once('value').then(s => {
      const call = s.val(); if (!call || call.status !== 'ringing') return;
      if (C) return; // že v klicu – klicatelj dobi "zasedeno" prek prisotnosti
      newCall({ id, role: 'in', other: call.from, status: 'incoming', createdAt: call.createdAt, offer: call.offer });
      callRef(id).update({ ringingAt: nowIso() });
      ringtone(); notify(call.from);
      addOff(callRef(id), 'value', s2 => {
        const c = s2.val(); if (!C || C.id !== id) return;

        if (C.status === 'incoming' && !C.answering && c.status === 'answered' && c.answeredBy !== DEV) { C.elsewhere = true; return finish('Sprejeto na drugi napravi', null); }
        if (C.status === 'incoming' && ['noanswer', 'cancelled', 'ended'].includes(c.status)) return finish('Zgrešen klic', 'missed');

  if (!C || C.id !== id) return;

/* ---------- tipkovnica ---------- */
const LET = { '2': 'ABC', '3': 'DEF', '4': 'GHI', '5': 'JKL', '6': 'MNO', '7': 'PQRS', '8': 'TUV', '9': 'WXYZ', '0': '+' };
function viewKeys(v) {
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '*', '0', '#'];
  v.innerHTML = `<div class="dialwrap"><div class="disp"><div class="num" id="d-num"></div><div class="name" id="d-name"></div></div>
    <div class="sugg" id="d-sugg"></div>
    <div class="keys">${keys.map(k => `<button class="key" data-k="${k}"><b>${k}</b><small>${LET[k] || ''}</small></button>`).join('')}</div>
    <div class="callrow"><span></span><button class="cbtn" onclick="dialCurrent()" aria-label="Pokliči">${ic('phone')}</button><button class="bsp" id="d-bsp" aria-label="Briši">${ic('backspace')}</button></div></div>`;
  v.querySelectorAll('.key').forEach(b => {
    let timer = null, down = false, long = false;
    b.addEventListener('pointerdown', e => {
      e.preventDefault(); const k = b.dataset.k; down = true; long = false; dtmf(k); b.classList.add('pr');
      if (k === '0') timer = setTimeout(() => { long = true; press('+'); }, 600);   // dolg pritisk na 0 = +
    });
    b.addEventListener('pointerup', () => { b.classList.remove('pr'); clearTimeout(timer); if (down && !long) press(b.dataset.k); down = false; });
    const cancel = () => { b.classList.remove('pr'); clearTimeout(timer); down = false; };
    b.addEventListener('pointerleave', cancel); b.addEventListener('pointercancel', cancel);
  });
  const bsp = $('d-bsp'); let lt = null;
  bsp.addEventListener('pointerdown', () => { lt = setTimeout(() => { lt = 'x'; S.dial = ''; updDisp(); }, 600); });
  bsp.addEventListener('pointerup', () => { if (lt !== 'x') { clearTimeout(lt); S.dial = S.dial.slice(0, -1); updDisp(); } lt = null; });
  updDisp();
}
function press(k) { if (S.dial.length < 16) { S.dial += k; updDisp(); } }
function updDisp() {
  const n = $('d-num'); if (!n) return;
  n.textContent = S.dial;
  n.style.fontSize = S.dial.length > 11 ? '30px' : '40px';
  const nm = lineName(S.dial), dn = $('d-name');
  dn.className = 'name' + (S.dial && !nm ? ' unk' : '');
  dn.textContent = S.dial ? (nm || (S.dial === S.me ? 'Tvoja številka' : '')) : '';
  const sg = S.dial && !nm ? linesSorted().filter(l => l.number.startsWith(S.dial) && l.number !== S.me).slice(0, 3) : [];
  $('d-sugg').innerHTML = sg.map(l => `<button onclick="S.dial='${l.number}';updDisp()"><b>${esc(l.number)}</b> ${esc(l.name)}</button>`).join('');
  $('d-bsp').style.visibility = S.dial ? 'visible' : 'hidden';
}
function dialCurrent() {
  if (!S.dial) { // kot na pravem telefonu: prazna tipkovnica prikliče zadnjo klicano številko
    const last = histList().find(h => h.dir === 'out'); if (last) { S.dial = last.other; updDisp(); } return;
  }
  dial(S.dial);
}
document.addEventListener('keydown', e => {
  if (!S.me || S.tab !== 'keys' || C || document.querySelector('.overlay') || /INPUT|TEXTAREA/.test((document.activeElement || {}).tagName)) return;
  if (/^[0-9*#+]$/.test(e.key)) { dtmf(e.key); press(e.key); }
  else if (e.key === 'Backspace') { S.dial = S.dial.slice(0, -1); updDisp(); }
  else if (e.key === 'Enter') dialCurrent();
});

/* ---------- nedavni klici ---------- */
const histList = () => Object.values(S.history || {}).filter(h => h && h.at).sort((a, b) => b.at.localeCompare(a.at));
function missedCount() { const seen = store.get('wii_fon_seen_' + S.me) || ''; return histList().filter(h => h.dir === 'in' && h.result === 'missed' && h.at > seen).length; }
const RES = { answered: '', missed: 'zgrešen', rejected: 'zavrnjen', noanswer: 'ni odgovora', cancelled: 'preklican', busy: 'zasedeno', unreachable: 'ni dosegljiv', failed: 'napaka povezave' };

      const miss = h.dir === 'in' && (h.result === 'missed' || h.result === 'rejected'), name = lineName(h.other);

        <div class="r">${fmtWhen(h.at)}</div><button class="callmini" onclick="dial('${esc(h.other)}')" aria-label="Pokliči">${ic('phone', 'sm')}</button></div>`;

function editLine(num, after) {

      <label class="lbl">Ime (prikaže se pri klicu)</label><input id="el-name" class="inp" maxlength="40" placeholder="${type === 'employee' ? 'privzeto ime zaposlenega' : 'npr. Dobavitelj Mercator'}" value="${esc(vName)}">
      <label class="lbl">Oddelek / opis (neobvezno)</label><input id="el-d" class="inp" maxlength="40" placeholder="npr. Skladišče" value="${esc(vD)}">

        <div class="muted" style="font-size:13px">S številko in PIN-om se zunanji uporabnik prijavi v WIIfon na svoji napravi. Brez PIN-a je številka samo v imeniku in ni dosegljiva.</div>` : ''}

    <button class="btn block" onclick="login()">${ic('login')}Prijava</button><div class="err" id="lg-e"></div>
    ${emps.length ? `<div class="lbl" style="text-align:center;margin:14px 0 8px">Hitri dostop</div><div class="quick">${emps.map(e => `<button onclick="quickUser('${e.id}')">${esc(e.name)}${myLineOf(e) ? `<small>${esc(myLineOf(e))}</small>` : ''}</button>`).join('')}</div>` : ''}
    ${Object.values(S.lines).some(l => l && l.type !== 'employee' && l.pin) ? `<button class="btn ghost block" style="margin-top:18px" onclick="extLogin()">${ic('key')}Zunanji uporabnik (številka + PIN)</button>` : ''}
    <div style="text-align:center;margin-top:18px;color:var(--muted);font-weight:700;font-size:12px;letter-spacing:2px">VERZIJA 1.0</div></div>`;
  $('lg-u').value = old.u; $('lg-p').value = old.p; if (old.f && $(old.f)) $(old.f).focus();
  $('lg-u').addEventListener('keydown', e => { if (e.key === 'Enter') $('lg-p').focus(); });
  $('lg-p').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
}
function quickUser(id) { const e = S.employees[id]; if (!e) return; $('lg-u').value = e.username; $('lg-p').value = ''; $('lg-p').focus(); }
function login() {
  ac();
  const u = $('lg-u').value.trim().toLowerCase(), p = $('lg-p').value, er = t => { $('lg-e').textContent = t; };
  const e = Object.values(S.employees).find(x => x && (x.username || '').toLowerCase() === u && x.password === p);
  if (!e) { $('lg-p').value = ''; return er('Napačno uporabniško ime ali geslo!'); }
  const num = myLineOf(e);
  if (!num && e.role !== 'admin') return er('Nimaš dodeljene telefonske številke. Obrni se na administratorja.');
  startSession({ kind: 'emp', emp: e });
  toast(num ? `Pozdravljen/a, ${e.name} – tvoja številka je ${num}` : 'Prijavljen kot administrator – nimaš svoje številke, lahko pa urejaš imenik.', 'ok');
}
function extLogin() {
  const ov = openModal(`<h3>${ic('key')}Zunanji uporabnik</h3><div class="muted">Vpiši številko in PIN, ki ti ju je dal administrator.</div>
    <label class="lbl" style="margin-top:12px">Telefonska številka</label><input id="xl-n" class="inp" inputmode="numeric" maxlength="10">
    <label class="lbl">PIN</label><input id="xl-p" class="inp" type="password" inputmode="numeric" maxlength="8">
    <div class="err" id="xl-e"></div><div class="rowbtns"><button class="btn ghost" id="xl-x">Prekliči</button><button class="btn" id="xl-ok">${ic('login')}Prijava</button></div>`);
  const go = () => {
    ac();
    const n = digits(ov.querySelector('#xl-n').value), l = S.lines[n];
    if (!l || l.type === 'employee' || !l.pin || ov.querySelector('#xl-p').value !== String(l.pin)) { ov.querySelector('#xl-e').textContent = 'Napačna številka ali PIN.'; return; }
    ov.close(); startSession({ kind: 'ext', number: n }); toast('Prijavljen/a kot ' + l.name + ' (' + n + ')', 'ok');
  };
  ov.querySelector('#xl-x').onclick = () => ov.close();
  ov.querySelector('#xl-ok').onclick = go;
  ov.querySelector('#xl-p').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  setTimeout(() => ov.querySelector('#xl-n').focus(), 60);
}

/* ---------- nastavitve ---------- */
function openSettings() {
  const l = S.lines[S.me] || {}, wake = store.get('wii_fon_wake') === '1';
  const who = S.user.kind === 'emp' ? S.user.emp.name : (l.name || '');
  const notif = 'Notification' in window ? Notification.permission : 'unsupported';
  const ov = openModal(`<h3>${ic('settings')}Nastavitve</h3>
    <div class="box" style="display:flex;gap:12px;align-items:center;margin-top:10px">${S.me ? avatar(S.me) : `<div class="av" style="background:#9ca3af">${ic('user')}</div>`}<div><b style="font-size:17px">${esc(who)}</b><div class="muted">${S.me ? 'Številka ' + esc(S.me) : 'Brez številke'}${S.admin ? ' · administrator' : S.user.kind === 'ext' ? ' · zunanji' : ''}</div></div></div>
    <div class="box" style="padding:4px 14px">
      <button class="tgl ${wake ? 'on' : ''}" id="st-w"><span>${ic('sun')} Ohrani zaslon prižgan<br><span class="muted" style="font-weight:400">Da telefon zanesljivo zvoni, mora biti aplikacija odprta.</span></span><span class="sw"></span></button>
      <button class="tgl" id="st-n"><span>${ic('bell')} Obvestila o klicih<br><span class="muted" style="font-weight:400">${notif === 'granted' ? 'Omogočena' : notif === 'denied' ? 'Zavrnjena v brskalniku' : notif === 'unsupported' ? 'Ni podprto' : 'Tapni za omogočanje'}</span></span>${ic('chevR')}</button>
      <button class="tgl" id="st-r"><span>${ic('volume')} Preizkusi zvonjenje</span>${ic('chevR')}</button>
      <button class="tgl" id="st-m"><span>${ic('mic')} Preizkusi mikrofon</span>${ic('chevR')}</button>
      ${S.admin ? `<button class="tgl" id="st-ed"><span>${ic('book')} Uredi imenik</span>${ic('chevR')}</button>` : ''}
    </div>
    <button class="btn red block" id="st-out">${ic('logout')}Odjava</button>
    <button class="btn ghost block" style="margin-top:10px" id="st-x">Zapri</button>`);
  ov.querySelector('#st-w').onclick = () => { const on = store.get('wii_fon_wake') !== '1'; store.set('wii_fon_wake', on ? '1' : '0'); if (on) requestWake(); else releaseWake(); ov.close(); openSettings(); };
  ov.querySelector('#st-n').onclick = () => { if (notif === 'default') Notification.requestPermission().then(() => { ov.close(); openSettings(); }); };
  ov.querySelector('#st-r').onclick = () => { ac(); ringtone(); setTimeout(stopTones, 3000); };
  ov.querySelector('#st-m').onclick = () => getMic().then(s => { s.getTracks().forEach(t => t.stop()); toast('Mikrofon deluje.', 'ok'); }).catch(e => toast('Mikrofon ni dovoljen: ' + (e.message || e.name), 'err'));
  const ed = ov.querySelector('#st-ed'); if (ed) ed.onclick = () => { ov.close(); openEditor(); };
  ov.querySelector('#st-out').onclick = () => { ov.close(); logout(); };
  ov.querySelector('#st-x').onclick = () => ov.close();
}

/* =====================================================================
   ZAGON
   ===================================================================== */
render();
(function auto() { // samodejna ponovna prijava po osvežitvi
  let u = null; try { u = JSON.parse(store.get('wii_fon_user') || 'null'); } catch (e) {}
  if (!u) return;
  const t = setInterval(() => {
    if (!S.ready.lines || !S.ready.employees) return; clearInterval(t);
    if (u.k === 'emp') { const e = S.employees[u.id]; if (e && (myLineOf(e) || e.role === 'admin')) return startSession({ kind: 'emp', emp: e }); }
    if (u.k === 'ext') { const l = S.lines[u.n]; if (l && l.type !== 'employee' && l.pin) return startSession({ kind: 'ext', number: u.n }); }
    store.del('wii_fon_user');
  }, 120);
})();
if (store.get('wii_fon_wake') === '1') document.addEventListener('pointerdown', function w() { if (S.me && !S.wake) requestWake(); document.removeEventListener('pointerdown', w); });

window.addEventListener('beforeunload', () => { if (C) hangup(); });
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
