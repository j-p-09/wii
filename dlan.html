<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WII Prenosnik (Dlančnik)</title>

<!-- FIREBASE SCRIPTS -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<!-- PDF in QR KODA SCRIPTS (Za tiskalnico) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

<style>
    /* RETRO POS STYLING */
    :root {
        --pos-bg: #d4d0c8;
        --pos-panel: #ece9d8;
        --pos-border-light: #ffffff;
        --pos-border-dark: #808080;
        --pos-border-darker: #404040;
        --pos-blue: #3a6ea5;
        --pos-text: #000000;
        --pos-highlight: #0a246a;
    }

    * { box-sizing: border-box; font-family: 'Times New Roman', Times, serif !important; margin: 0; padding: 0; user-select: none; }
    body { background-color: var(--pos-bg); color: var(--pos-text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; font-size: 18px; }
    
    /* 3D Gumbi */
    button { 
        cursor: pointer; background: var(--pos-bg); color: var(--pos-text); font-weight: bold; font-size: 18px;
        border-top: 2px solid var(--pos-border-light); border-left: 2px solid var(--pos-border-light);
        border-right: 2px solid var(--pos-border-darker); border-bottom: 2px solid var(--pos-border-darker);
        padding: 10px; box-shadow: inset 1px 1px 0px #fff, inset -1px -1px 0px var(--pos-border-dark);
    }
    button:active {
        border-top: 2px solid var(--pos-border-darker); border-left: 2px solid var(--pos-border-darker);
        border-right: 2px solid var(--pos-border-light); border-bottom: 2px solid var(--pos-border-light);
        box-shadow: inset 1px 1px 0px var(--pos-border-dark); padding: 11px 9px 9px 11px;
    }
    
    input { 
        padding: 8px; font-size: 18px; 
        border-top: 2px solid var(--pos-border-dark); border-left: 2px solid var(--pos-border-dark);
        border-right: 2px solid var(--pos-border-light); border-bottom: 2px solid var(--pos-border-light);
    }
    input:focus { outline: none; background: #ffffcc; }

    /* POGLEDI (Views) */
    .view { display: none; flex-direction: column; height: 100%; overflow: hidden; }
    .view.active { display: flex; }

    /* LOGINA & WELCOME */
    .center-box { margin: auto; padding: 20px; background: var(--pos-panel); border: 3px outset #fff; text-align: center; width: 90%; max-width: 400px; }
    .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 15px; }
    .numpad button { height: 60px; font-size: 24px; }
    
    .long-btn { width: 100%; margin: 8px 0; padding: 15px; font-size: 20px; text-align: center; }

    /* GLAVNI SISTEM / MAIN LAYOUT */
    .top-tray { background: var(--pos-blue); color: white; padding: 10px; text-align: center; font-weight: bold; border-bottom: 2px solid var(--pos-border-darker); display: flex; justify-content: space-between; align-items: center; }
    
    .workspace { flex: 1; overflow-y: auto; padding: 5px; background: #fff; border: 2px inset #808080; margin: 5px; display: flex; flex-direction: column; gap: 5px; }
    
    /* Gumbi za skupine in artikle */
    .grid-btn-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .item-btn { height: 80px; font-size: 16px; display: flex; flex-direction: column; justify-content: center; align-items: center; white-space: normal; line-height: 1.2; }
    .group-btn { background: #a9b8c2; height: 70px; }

    /* Tabela vozička */
    .cart-list { flex: 1; overflow-y: auto; border: 1px solid #ccc; background: white; }
    .cart-item { display: flex; justify-content: space-between; padding: 15px 10px; border-bottom: 1px solid #eee; align-items: center; }
    .cart-item:active { background: var(--pos-highlight); color: white; }
    .cart-item .qty { font-weight: bold; margin-right: 10px; }
    .cart-item .price { font-weight: bold; }
    .cart-total { padding: 15px; text-align: right; font-size: 24px; font-weight: bold; background: #e0e0e0; border-top: 2px solid #aaa; }

    /* Spodnja vrstica z akcijami (Naročilo) */
    .order-actions { display: flex; gap: 5px; padding: 5px; background: #a9b8c2; border-top: 2px solid var(--pos-border-dark); }
    .order-actions button { flex: 1; height: 60px; font-size: 16px; }
    .order-actions .btn-pay { background: #ccffcc; }

    /* Spodnja vrstica sistema (Navigacija) */
    .sys-actions { display: flex; gap: 5px; padding: 5px; background: var(--pos-panel); border-top: 2px solid var(--pos-border-light); }
    .sys-actions button { flex: 1; height: 60px; font-size: 16px; }

    /* Modali */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: var(--pos-bg); border: 3px outset #fff; width: 90%; max-width: 400px; padding: 15px; display: flex; flex-direction: column; gap: 10px; text-align: center; }

    .order-card { background: var(--pos-panel); border: 2px outset #fff; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .order-card:active { border-style: inset; }

    .hidden { display: none !important; }
</style>
</head>
<body>

    <!-- POGLED 1: PRIJAVA -->
    <div id="view-login" class="view active">
        <div class="center-box">
            <h2 style="margin-bottom:15px;">PRIJAVA</h2>
            <input type="password" id="login-pin" readonly placeholder="Kartica / PIN" style="width:100%; text-align:center;">
            <div class="numpad">
                <button onclick="pinInput('1')">1</button><button onclick="pinInput('2')">2</button><button onclick="pinInput('3')">3</button>
                <button onclick="pinInput('4')">4</button><button onclick="pinInput('5')">5</button><button onclick="pinInput('6')">6</button>
                <button onclick="pinInput('7')">7</button><button onclick="pinInput('8')">8</button><button onclick="pinInput('9')">9</button>
                <button onclick="pinClear()">C</button><button onclick="pinInput('0')">0</button><button onclick="login()" style="background:var(--pos-blue); color:white;">OK</button>
            </div>
        </div>
    </div>

    <!-- POGLED 2: WELCOME SCREEN -->
    <div id="view-welcome" class="view">
        <div style="flex:1; display:flex; flex-direction:column; justify-content:center; padding: 20px;">
            <h1 style="text-align:center; margin-bottom: 30px; font-size: 28px;">Dobrodošel<br><span id="welcome-name" style="color:var(--pos-blue);"></span></h1>
            
            <button class="long-btn" onclick="logout()">ODJAVA (<span id="btn-logout-name"></span>)</button>
            <button class="long-btn" onclick="openSystem()" style="background:#ccffcc; height: 80px;">VSTOPI V SISTEM</button>
            <button class="long-btn" onclick="openTiskalnica()">TISKALNICA</button>
            <button class="long-btn" onclick="testTiskalnika()">TEST TISKALNIKA</button>
        </div>
    </div>

    <!-- POGLED 3: GLAVNI SISTEM (Seznam naročil) -->
    <div id="view-system" class="view">
        <div class="top-tray">
            <span>AKTIVNA NAROČILA</span>
            <span id="sys-clock"></span>
        </div>
        <div class="workspace" id="orders-list">
            <!-- Dinamičen seznam naročil -->
        </div>
        <div class="sys-actions">
            <button onclick="openSystem()">Vsa naročila</button>
            <button onclick="showMenu()">Meni</button>
            <button onclick="startNewOrder()" style="background: #cceeff;">Novo naročilo</button>
        </div>
    </div>

    <!-- POGLED 4: NAROČILO (Ustvarjanje / Urejanje) -->
    <div id="view-order" class="view">
        <div class="top-tray">
            <div style="display:flex; align-items:center; gap:10px;">
                <span id="order-title">Naročilo #---</span>
                <button onclick="editCustomer()" style="font-size:12px; padding: 4px 8px;">👤 Stranka</button>
            </div>
            <span id="order-customer-name"></span>
        </div>
        
        <!-- Področje Artiklov (Način dodajanja) -->
        <div class="workspace" id="order-add-mode">
            <div style="padding:5px; font-weight:bold; background:#e0e0e0; text-align:center;" id="current-group-label">IZBERI SKUPINO</div>
            <div class="grid-btn-container" id="grid-content">
                <!-- Skupine ali Artikli -->
            </div>
        </div>

        <!-- Področje Računa (Način pregleda) -->
        <div class="workspace hidden" id="order-cart-mode" style="padding:0;">
            <div class="cart-list" id="cart-list"></div>
            <div class="cart-total" id="cart-total">Skupaj: 0.00 WII</div>
            <!-- Tiskaj gumb po plačilu -->
            <button id="btn-tiskaj" class="hidden" onclick="printCurrentReceipt()" style="margin: 10px; background:var(--pos-blue); color:white; height:60px;">🖨️ TISKAJ RAČUN</button>
        </div>

        <div class="order-actions">
            <button id="btn-toggle-view" onclick="toggleOrderView()">☰ Pregled</button>
            <button id="btn-action-middle" onclick="searchItem()">🔍 Iskanje</button>
            <button id="btn-save-order" onclick="saveOrder()">Shrani</button>
        </div>
    </div>

    <!-- POGLED 5: TISKALNICA -->
    <div id="view-tiskalnica" class="view">
        <div class="top-tray">🖨️ TISKALNICA KOPIJ</div>
        <div class="workspace" style="justify-content:center; padding:20px; align-items:center;">
            <p style="margin-bottom:10px;">Vnesi številko že plačanega računa:</p>
            <input type="number" id="reprint-id" style="width:100%; max-width:300px; text-align:center; font-size:24px; padding:15px;">
            <button onclick="findAndReprint()" class="long-btn" style="max-width:300px; background:#cceeff; margin-top:20px;">IŠČI IN NATISNI</button>
            <button onclick="document.getElementById('view-tiskalnica').classList.remove('active'); document.getElementById('view-welcome').classList.add('active');" class="long-btn" style="max-width:300px; margin-top:40px;">⬅ Nazaj</button>
        </div>
    </div>

    <!-- MODAL SYSTEM -->
    <div class="modal-overlay" id="custom-modal">
        <div class="modal-box">
            <h3 id="modal-title">Naslov</h3>
            <p id="modal-message">Sporočilo</p>
            <input type="text" id="modal-input" class="hidden">
            <div id="modal-numpad" class="numpad hidden">
                <!-- numpad generated via JS if needed -->
            </div>
            <div style="display:flex; gap:10px; margin-top:15px; justify-content:center;" id="modal-footer"></div>
        </div>
    </div>

<script>
    /* ================= FIREBASE SETUP ================= */
    const firebaseConfig = {
        databaseURL: "https://wii-sh-default-rtdb.europe-west1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    /* ================= GLOBAL variables ================= */
    let dbData = { users: [], items: [], groups: [], orders: [], receipts: [], seq: 1, orderSeq: 100, register: {expectedCash:0} };
    let currentUser = null;
    let currentOrder = null; // { id, customer, customerId, items: [], status }
    let isCartView = false;
    let pinBuffer = "";
    let modalCallback = null;

    // Sinhronizacija
    database.ref('wii_db_v3').on('value', (snapshot) => {
        const data = snapshot.val();
        if(data) {
            dbData = data;
            if(!dbData.users) dbData.users = [];
            if(!dbData.items) dbData.items = [];
            if(!dbData.groups) dbData.groups = ['SHOP'];
            if(!dbData.orders) dbData.orders = [];
            if(!dbData.receipts) dbData.receipts = [];
            
            // Posodobimo UI če smo v pregledu naročil
            if(document.getElementById('view-system').classList.contains('active')) {
                renderOrdersList();
            }
        }
    });

    /* ================= POMOŽNE FUNKCIJE ================= */
    function switchView(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(`view-${viewId}`).classList.add('active');
    }

    setInterval(() => {
        let d = new Date();
        let clock = document.getElementById('sys-clock');
        if(clock) clock.innerText = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
    }, 1000);

    /* ================= LOGIN & WELCOME ================= */
    function pinInput(num) { pinBuffer += num; document.getElementById('login-pin').value = "*".repeat(pinBuffer.length); }
    function pinClear() { pinBuffer = ""; document.getElementById('login-pin').value = ""; }
    
    function login() {
        const user = dbData.users.find(u => u.card === pinBuffer || u.id === pinBuffer);
        if(user) {
            currentUser = user;
            document.getElementById('welcome-name').innerText = user.name;
            document.getElementById('btn-logout-name').innerText = user.name;
            pinClear();
            switchView('welcome');
        } else {
            alert("Napačna kartica ali PIN!");
            pinClear();
        }
    }

    function logout() { currentUser = null; switchView('login'); }
    function openSystem() { switchView('system'); renderOrdersList(); }

    /* ================= GLAVNI SISTEM ================= */
    function renderOrdersList() {
        let container = document.getElementById('orders-list');
        container.innerHTML = '';
        
        let openOrders = dbData.orders.filter(o => o.status === 'NAROČENO');
        
        if(openOrders.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:20px; color:#666;">Ni odprtih naročil.</div>`;
            return;
        }

        openOrders.forEach(o => {
            let total = o.items.reduce((acc, it) => acc + (it.total || 0), 0);
            container.innerHTML += `
                <div class="order-card" onclick="openExistingOrder(${o.id})">
                    <div>
                        <div style="font-weight:bold; font-size:20px;">#${o.id} - ${o.customer || 'Miza'}</div>
                        <div style="font-size:14px; color:#555;">Artiklov: ${o.items.length}</div>
                    </div>
                    <div style="font-size:20px; font-weight:bold;">${total.toFixed(2)} WII</div>
                </div>
            `;
        });
    }

    function showMenu() {
        alert("Prikazujem meni/katalog (Lahko služi kot hiter vpogled v artikle).");
        // Lahko naredimo view samo za brskanje, trenutno ostane na system.
    }

    /* ================= NAROČILA ================= */
    function startNewOrder() {
        let nextId = dbData.orderSeq;
        currentOrder = {
            id: nextId, customer: "", customerId: null, items: [], status: 'NAROČENO', date: new Date().toISOString()
        };
        document.getElementById('order-title').innerText = `Naročilo #${nextId}`;
        document.getElementById('order-customer-name').innerText = "";
        
        isCartView = false;
        switchView('order');
        updateOrderUI();
        renderGroups();
    }

    function openExistingOrder(id) {
        let order = dbData.orders.find(o => o.id === id);
        if(!order) return;
        
        currentOrder = JSON.parse(JSON.stringify(order)); // Deep copy za urejanje
        document.getElementById('order-title').innerText = `Naročilo #${currentOrder.id}`;
        document.getElementById('order-customer-name').innerText = currentOrder.customer || "";
        
        isCartView = true; // Če odpremo obstoječe, začnemo na pregledu
        switchView('order');
        updateOrderUI();
    }

    function editCustomer() {
        showModal("Stranka", "Vnesi ime stranke / mize:", "text", (val) => {
            if(val !== null) {
                currentOrder.customer = val;
                document.getElementById('order-customer-name').innerText = val;
            }
        });
    }

    /* --- DODAJANJE ARTIKLOV --- */
    function renderGroups() {
        let container = document.getElementById('grid-content');
        document.getElementById('current-group-label').innerText = "IZBERI SKUPINO";
        container.innerHTML = '';
        dbData.groups.forEach(g => {
            let btn = document.createElement('button');
            btn.className = 'group-btn'; btn.innerText = g;
            btn.onclick = () => renderItems(g);
            container.appendChild(btn);
        });
    }

    function renderItems(groupName) {
        let container = document.getElementById('grid-content');
        document.getElementById('current-group-label').innerText = `SKUPINA: ${groupName}`;
        container.innerHTML = '';
        
        let backBtn = document.createElement('button');
        backBtn.innerText = "⬅ NAZAJ";
        backBtn.onclick = () => renderGroups();
        container.appendChild(backBtn);

        let items = dbData.items.filter(i => (i.skupina || 'SHOP') === groupName);
        items.forEach(it => {
            let btn = document.createElement('button');
            btn.className = 'item-btn';
            btn.innerHTML = `<span>${it.naziv}</span><span style="font-size:14px; font-weight:normal;">${it.cena.toFixed(2)} WII</span>`;
            btn.onclick = () => addItemToOrder(it);
            container.appendChild(btn);
        });
    }

    function addItemToOrder(item) {
        let existing = currentOrder.items.find(i => i.koda === item.koda);
        if(existing) {
            existing.kol += 1;
            existing.total = existing.kol * existing.cena;
        } else {
            currentOrder.items.push({
                koda: item.koda, naziv: item.naziv, kol: 1, cena: item.cena, popust: 0, total: item.cena
            });
        }
        // Majhen feedback
        document.getElementById('current-group-label').innerText = `Dodano: ${item.naziv}`;
        setTimeout(() => { if(!isCartView) document.getElementById('current-group-label').innerText = `SKUPINA: ${item.skupina}`; }, 1000);
    }

    /* --- PREGLED RAČUNA (CART) --- */
    function toggleOrderView() {
        isCartView = !isCartView;
        updateOrderUI();
    }

    function updateOrderUI() {
        let addMode = document.getElementById('order-add-mode');
        let cartMode = document.getElementById('order-cart-mode');
        let btnToggle = document.getElementById('btn-toggle-view');
        let btnMiddle = document.getElementById('btn-action-middle');
        let btnTiskaj = document.getElementById('btn-tiskaj');

        if(isCartView) {
            addMode.classList.add('hidden');
            cartMode.classList.remove('hidden');
            
            btnToggle.innerText = "➕ DODAJ";
            
            if(currentOrder.status === 'PLAČANO') {
                btnMiddle.innerText = "PLAČANO";
                btnMiddle.disabled = true;
                btnTiskaj.classList.remove('hidden');
                document.getElementById('btn-save-order').classList.add('hidden');
            } else {
                btnMiddle.innerText = "💳 PLAČAJ";
                btnMiddle.disabled = false;
                btnMiddle.onclick = () => openPayment();
                btnTiskaj.classList.add('hidden');
                document.getElementById('btn-save-order').classList.remove('hidden');
            }
            renderCartList();
        } else {
            addMode.classList.remove('hidden');
            cartMode.classList.add('hidden');
            
            btnToggle.innerText = "☰ Pregled";
            btnMiddle.innerText = "🔍 Iskanje";
            btnMiddle.disabled = false;
            btnMiddle.onclick = () => searchItem();
            
            renderGroups();
        }
    }

    function renderCartList() {
        let container = document.getElementById('cart-list');
        container.innerHTML = '';
        let total = 0;

        currentOrder.items.forEach((it, idx) => {
            total += (it.total || 0);
            container.innerHTML += `
                <div class="cart-item" onclick="${currentOrder.status !== 'PLAČANO' ? `editCartItem(${idx})` : ''}">
                    <div>
                        <span class="qty">${it.kol}x</span>
                        <span>${it.naziv}</span>
                    </div>
                    <div class="price">${it.total.toFixed(2)}</div>
                </div>
            `;
        });
        document.getElementById('cart-total').innerText = `Skupaj: ${total.toFixed(2)} WII`;
    }

    function editCartItem(idx) {
        let it = currentOrder.items[idx];
        showModal("Uredi Količino", `Artikel: ${it.naziv}`, "number", (val) => {
            if(val !== null) {
                let qty = parseFloat(val);
                if(qty <= 0) {
                    currentOrder.items.splice(idx, 1);
                } else {
                    currentOrder.items[idx].kol = qty;
                    currentOrder.items[idx].total = qty * currentOrder.items[idx].cena;
                }
                renderCartList();
            }
        });
    }

    function searchItem() {
        showModal("Iskanje", "Vnesi naziv artikla:", "text", (val) => {
            if(!val) return;
            let found = dbData.items.filter(i => i.naziv.toLowerCase().includes(val.toLowerCase()));
            if(found.length > 0) {
                let container = document.getElementById('grid-content');
                document.getElementById('current-group-label').innerText = "REZULTATI ISKANJA";
                container.innerHTML = '<button onclick="renderGroups()">⬅ NAZAJ</button>';
                found.forEach(it => {
                    let btn = document.createElement('button');
                    btn.className = 'item-btn';
                    btn.innerHTML = `<span>${it.naziv}</span><span>${it.cena.toFixed(2)} WII</span>`;
                    btn.onclick = () => addItemToOrder(it);
                    container.appendChild(btn);
                });
            } else {
                alert("Ni najdenih artiklov.");
            }
        });
    }

    /* --- SHRANJEVANJE IN PLAČILO --- */
    function saveOrder() {
        if(currentOrder.items.length === 0) return alert("Naročilo je prazno!");
        
        let existingIdx = dbData.orders.findIndex(o => o.id === currentOrder.id);
        let total = currentOrder.items.reduce((acc, it) => acc + (it.total || 0), 0);
        currentOrder.total = total;

        if(existingIdx >= 0) {
            dbData.orders[existingIdx] = currentOrder;
        } else {
            dbData.orders.push(currentOrder);
            dbData.orderSeq++;
        }
        
        database.ref('wii_db_v3').set(dbData).then(() => {
            alert("Naročilo shranjeno!");
            openSystem();
        });
    }

    function openPayment() {
        if(currentOrder.items.length === 0) return alert("Naročilo je prazno!");
        let total = currentOrder.items.reduce((acc, it) => acc + (it.total || 0), 0);
        currentOrder.total = total;

        showModal("Plačilo", `Za plačilo: ${total.toFixed(2)} WII
Izberi način plačila:`, "none", null, true);
        
        let footer = document.getElementById('modal-footer');
        footer.innerHTML = `
            <button onclick="processPayment('gotovina')" style="background:#ccffcc; font-size:20px; padding:10px;">💵 GOTOVINA</button>
            <button onclick="processPayment('kartica')" style="background:#cceeff; font-size:20px; padding:10px;">💳 KARTICA</button>
            <button onclick="closeModal()" style="background:#ffcccc; font-size:20px; padding:10px;">Prekliči</button>
        `;
    }

    function processPayment(method) {
        if(method === 'kartica') {
            showModal("Kartica", "Vnesi PIN stranke:", "text", (pin) => {
                if(!pin) return;
                let user = dbData.users.find(u => u.card === pin || u.id === pin);
                if(!user) return alert("Neveljavna kartica!");
                if((user.bankBalance || 0) < currentOrder.total) return alert("Premalo sredstev na banki!");
                
                user.bankBalance -= currentOrder.total;
                if(!user.transactions) user.transactions = [];
                user.transactions.push({ id: Date.now(), type: 'POS_PAYMENT', amount: -currentOrder.total, balanceAfter: user.bankBalance });
                
                finalizePayment(method, user.id);
            });
        } else {
            // Gotovina
            dbData.register.expectedCash += currentOrder.total;
            finalizePayment(method, null);
        }
    }

    function finalizePayment(method, paidUserId) {
        currentOrder.status = 'PLAČANO';
        
        // Naredimo račun
        let newReceipt = {
            id: dbData.seq,
            date: new Date().toISOString(),
            cashier: currentUser ? currentUser.name : 'Dlančnik',
            customer: currentOrder.customer || '',
            customerId: paidUserId,
            total: currentOrder.total,
            method: method,
            items: JSON.parse(JSON.stringify(currentOrder.items))
        };
        
        currentOrder.receiptId = newReceipt.id;
        dbData.receipts.push(newReceipt);
        dbData.seq++;

        // Posodobi naročilo v bazi
        let existingIdx = dbData.orders.findIndex(o => o.id === currentOrder.id);
        if(existingIdx >= 0) dbData.orders[existingIdx] = currentOrder;
        else { dbData.orders.push(currentOrder); dbData.orderSeq++; }

        database.ref('wii_db_v3').set(dbData).then(() => {
            closeModal();
            updateOrderUI(); // Osveži UI na pregled in pokaže gumb TISKAJ
            alert(`Plačano (${method})! Račun #${newReceipt.id} kreiran.`);
        });
    }

    /* ================= TISKALNICA IN PDF ================= */
    const jsPDF = window.jspdf.jsPDF;

    function cleanText(str) {
        if(!str) return "";
        return str.replace(/[čć]/g, 'c').replace(/[ČĆ]/g, 'C').replace(/š/g, 's').replace(/Š/g, 'S').replace(/ž/g, 'z').replace(/Ž/g, 'Z');
    }

    function drawDashedLine(doc, y) {
        doc.setLineWidth(0.5); doc.setLineDashPattern([1, 1], 0);
        doc.line(2, y, 56, y); doc.setLineDashPattern([], 0);
    }

    function buildReceiptPDF(receipt, isCopy = false) {
        let baseHeight = 110;
        let itemHeight = 6;
        let totalHeight = baseHeight + (receipt.items.length * itemHeight);
        
        const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: [58, totalHeight] });
        let y = 8;
        
        if(isCopy) {
            doc.setFillColor(0, 0, 0); doc.rect(2, 2, 54, 8, 'F');
            doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(10);
            doc.text("KOPIJA RACUNA", 29, 7, { align: "center" });
            doc.setTextColor(0, 0, 0); y += 10;
        }

        doc.setFontSize(8); doc.setFont("helvetica", "normal");
        doc.text("WII Shop", 29, y, { align: "center" }); y += 6;
        doc.setFontSize(16); doc.setFont("helvetica", "bold");
        doc.text("RACUN", 29, y, { align: "center" }); y += 6;

        doc.setFontSize(8); doc.setFont("helvetica", "normal");
        doc.text(`St. racuna: ${receipt.id.toString().padStart(3, '0')}`, 29, y, { align: "center" });
        doc.text(`Datum: ${new Date(receipt.date).toLocaleString()}`, 29, y+4, { align: "center" });
        y += 8;

        drawDashedLine(doc, y); y += 4;
        doc.setFontSize(7); doc.setFont("helvetica", "bold");
        doc.text("ARTIKEL", 2, y); doc.text("KOL", 36, y, { align: "center" }); doc.text("CENA", 56, y, { align: "right" });
        y += 4; drawDashedLine(doc, y); y += 4;

        doc.setFont("helvetica", "normal");
        receipt.items.forEach(item => {
            let name = cleanText(item.naziv).substring(0, 18);
            if(item.stornirano) name = "(STORNO) " + name.substring(0, 9);
            doc.text(name, 2, y);
            doc.text(item.kol.toString(), 36, y, { align: "center" });
            doc.text(item.total.toFixed(2), 56, y, { align: "right" });
            y += itemHeight;
        });

        drawDashedLine(doc, y); y += 6;
        doc.setFontSize(12); doc.setFont("helvetica", "bold");
        doc.text("ZA PLACILO:", 2, y); doc.text(`${receipt.total.toFixed(2)} WII`, 56, y, { align: "right" });
        y += 8;

        doc.setFontSize(8); doc.setFont("helvetica", "normal");
        doc.text("PODATKI O TRANSAKCIJI:", 2, y); y += 5;
        doc.text(`Nacin placila:`, 2, y); doc.text(cleanText(receipt.method).toUpperCase(), 56, y, {align:"right"}); y += 4;
        doc.text(`Blagajnik:`, 2, y); doc.text(cleanText(receipt.cashier), 56, y, {align:"right"}); y += 4;
        if(receipt.customer) { doc.text(`Stranka:`, 2, y); doc.text(cleanText(receipt.customer), 56, y, {align:"right"}); y += 4; }

        y += 2; drawDashedLine(doc, y); y += 5;
        const qr = new QRious({ value: `WII-RACUN-${receipt.id}`, size: 150 });
        doc.addImage(qr.toDataURL(), 'PNG', 19, y, 20, 20); y += 26;
        doc.setFontSize(10); doc.setFont("helvetica", "bold");
        doc.text("Hvala za nakup.", 29, y, { align: "center" });

        doc.save(`Racun_${receipt.id}.pdf`);
    }

    function printCurrentReceipt() {
        if(!currentOrder || !currentOrder.receiptId) return;
        let receipt = dbData.receipts.find(r => r.id === currentOrder.receiptId);
        if(receipt) {
            buildReceiptPDF(receipt, false);
            // Vrni se v sistem po tiskanju
            setTimeout(() => openSystem(), 1000);
        }
    }

    function openTiskalnica() { switchView('tiskalnica'); document.getElementById('reprint-id').value = ""; }

    function findAndReprint() {
        let id = parseInt(document.getElementById('reprint-id').value);
        if(isNaN(id)) return alert("Vnesi veljavno številko!");
        let receipt = dbData.receipts.find(r => r.id === id);
        if(receipt) {
            buildReceiptPDF(receipt, true);
        } else {
            alert("Račun s to številko ne obstaja!");
        }
    }

    function testTiskalnika() {
        const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: [58, 80] });
        doc.setFont("helvetica", "bold"); doc.setFontSize(14);
        doc.text("TEST TISKALNIKA", 29, 20, { align: "center" });
        doc.setFontSize(10); doc.setFont("helvetica", "normal");
        doc.text("Tiskalnik na dlančniku", 29, 30, { align: "center" });
        doc.text("uspešno povezan!", 29, 36, { align: "center" });
        drawDashedLine(doc, 45);
        const qr = new QRious({ value: `TEST-OK`, size: 100 });
        doc.addImage(qr.toDataURL(), 'PNG', 19, 50, 20, 20);
        doc.save(`Test_Tiskalnika.pdf`);
    }

    /* ================= UNIVERZALNI MODAL ================= */
    function showModal(title, message, inputType, onConfirm, customFooter = false) {
        document.getElementById('custom-modal').classList.add('active');
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-message').innerText = message;
        
        let inp = document.getElementById('modal-input');
        if(inputType !== 'none') {
            inp.classList.remove('hidden');
            inp.type = inputType === 'number' ? 'number' : 'text';
            inp.value = '';
        } else {
            inp.classList.add('hidden');
        }

        modalCallback = onConfirm;

        let footer = document.getElementById('modal-footer');
        if(!customFooter) {
            footer.innerHTML = `
                <button onclick="closeModal(false)" style="padding:10px;">Prekliči</button>
                <button onclick="closeModal(true)" style="background:var(--pos-blue); color:white; padding:10px;">Potrdi</button>
            `;
        }
    }

    function closeModal(isConfirm) {
        document.getElementById('custom-modal').classList.remove('active');
        if(isConfirm && modalCallback) {
            let val = document.getElementById('modal-input').value;
            modalCallback(val);
        }
    }

</script>
